name: ConnectMe Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connectme-image-main
  cancel-in-progress: false

jobs:
  build-and-push:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Testar e analisar Go
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src golang:1.24.6-alpine3.22 sh -ec 'go test ./... && go vet ./...'

      - name: Definir versão incremental
        id: meta
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          set -euo pipefail
          test -n "$DOCKER_USERNAME"
          echo "image=$DOCKER_USERNAME/connectme-server" >> "$GITHUB_OUTPUT"
          echo "version=1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Impedir publicação de execução antiga sobre latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$current_sha" = "$GITHUB_SHA" || { echo 'A main avançou; publique a execução mais recente.'; exit 1; }

      - name: Construir e publicar a mesma imagem com versão e latest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: server
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:dev
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=connectme-server
          cache-to: type=gha,scope=connectme-server,mode=max

      - name: Resumo da publicação
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'Imagem: %s:%s\n\nDigest: %s\n\nAliases: latest, dev. Nenhum deploy realizado.\n' "$IMAGE" "$VERSION" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
