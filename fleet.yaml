# GitRepo path: . (not base). Production is selected explicitly.
defaultNamespace: connectme-pro
kustomize:
  dir: overlays/pro
helm:
  # Preserve the existing downstream release name. Never force ownership.
  releaseName: connectme-pro-base
  timeoutSeconds: 300
# Protect resources if this bundle is removed; deletion is an operator decision.
keepResources: true
