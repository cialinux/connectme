apiVersion: apps/v1
kind: Deployment
metadata:
  name: connectme
spec:
  replicas: 1
  # In-memory leases and one temporary filesystem: do not use RollingUpdate/HPA.
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: connectme}
  template:
    metadata:
      labels: {app: connectme}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      # All runtime images are public; no namespace-local registry secret needed.
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: wait-postgres
          image: postgres:17.6-alpine3.22
          command: [sh, -ec, 'until pg_isready -h postgres -U connectme -d connectme; do sleep 2; done']
          securityContext:
            runAsUser: 70
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
      containers:
        - name: server
          image: virgiliofilhos/connectme-server:dev
          imagePullPolicy: Always
          ports: [{name: http, containerPort: 8081}]
          envFrom:
            - secretRef: {name: connectme-runtime}
          env:
            - {name: CONNECTME_HTTP_ADDRESS, value: ":8081"}
            - {name: CONNECTME_COOKIE_SECURE, value: "true"}
            - {name: CONNECTME_TRANSFER_ROOT, value: /var/lib/connectme/transfers}
            - {name: CONNECTME_SSH_KNOWN_HOSTS, value: /etc/connectme/ssh_known_hosts}
            # Keep cluster internals denied even when reusing the Compose .env.
            - {name: CONNECTME_REMOTE_DENY_CIDRS, value: "10.244.0.0/16,10.43.0.0/16,169.254.0.0/16"}
          startupProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 768Mi}
          volumeMounts:
            - {name: transfers, mountPath: /var/lib/connectme/transfers}
            - {name: server-tmp, mountPath: /tmp}
            - {name: ssh-trust, mountPath: /etc/connectme, readOnly: true}
        - name: guacamole
          image: guacamole/guacamole:1.6.0
          ports: [{name: gateway, containerPort: 8080}]
          env:
            - {name: GUACD_HOSTNAME, value: "127.0.0.1"}
            - {name: JSON_ENABLED, value: "true"}
            - name: JSON_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: connectme-runtime, key: CONNECTME_GUACAMOLE_KEY}
          startupProbe:
            httpGet: {path: /guacamole/, port: gateway}
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /guacamole/, port: gateway}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /guacamole/, port: gateway}
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            runAsUser: 1001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
        - name: guacd
          image: guacamole/guacd:1.6.0
          ports: [{name: guacd, containerPort: 4822}]
          startupProbe:
            tcpSocket: {port: guacd}
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            tcpSocket: {port: guacd}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: guacd}
            periodSeconds: 20
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "2", memory: 1Gi}
          volumeMounts:
            - {name: transfers, mountPath: /var/lib/connectme/transfers}
      volumes:
        - name: transfers
          emptyDir: {medium: Memory, sizeLimit: 512Mi}
        - name: server-tmp
          emptyDir: {sizeLimit: 64Mi}
        - name: ssh-trust
          configMap: {name: connectme-ssh-trust}
