apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: connectme-session-boundary}
spec:
  podSelector:
    matchLabels: {app: connectme}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
      ports: [{protocol: TCP, port: 8081}]
    - from:
        - podSelector:
            matchLabels: {app: connectme}
      ports: [{protocol: TCP, port: 8080}]
  # Authorized unrestricted outbound traffic; internal ingress remains isolated.
  egress:
    - {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: connectme-database-boundary}
spec:
  podSelector:
    matchLabels: {app: connectme-postgres}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: connectme}
      ports: [{protocol: TCP, port: 5432}]
  egress: []
