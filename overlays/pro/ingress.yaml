apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: connectme
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production-cialinux
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "34m"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # Public HTTPS access; authentication and RBAC remain mandatory.
spec:
  ingressClassName: nginx
  tls:
    - hosts: [connectme.cialinux.com]
      secretName: connectme-pro-tls
  rules:
    - host: connectme.cialinux.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: connectme
                port: {number: 80}
