apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: connectme
  annotations:
    cert-manager.io/cluster-issuer: your-cluster-issuer-dev
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "34m"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # Explicit replacement of the previously deployed restricted annotation.
    nginx.ingress.kubernetes.io/whitelist-source-range: "0.0.0.0/0,::/0"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [connectme.dev.your-domain.com]
      secretName: connectme-dev-tls
  rules:
    - host: connectme.dev.your-domain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: connectme
                port: {number: 80}
