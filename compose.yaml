name: connectme
services:
  postgres:
    restart: unless-stopped
    image: docker.io/library/postgres:17.6-alpine3.22
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-connectme}
      POSTGRES_USER: ${POSTGRES_USER:-connectme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?configure POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [backend]
    security_opt: [no-new-privileges:true]
  server:
    restart: unless-stopped
    build: {context: ., target: server}
    environment:
      CONNECTME_DATABASE_URL: ${CONNECTME_DATABASE_URL}
      CONNECTME_ENV: ${CONNECTME_ENV:-development}
      CONNECTME_HTTP_ADDRESS: :8080
      CONNECTME_MODULES: ${CONNECTME_MODULES:-system=true}
      CONNECTME_MASTER_KEY: ${CONNECTME_MASTER_KEY:?configure CONNECTME_MASTER_KEY in .env}
      CONNECTME_AUDIT_HMAC_KEY: ${CONNECTME_AUDIT_HMAC_KEY:?configure CONNECTME_AUDIT_HMAC_KEY in .env}
      CONNECTME_COOKIE_SECURE: ${CONNECTME_COOKIE_SECURE:-false}
      CONNECTME_SESSION_TTL: ${CONNECTME_SESSION_TTL:-12h}
      CONNECTME_SESSION_IDLE_TTL: ${CONNECTME_SESSION_IDLE_TTL:-30m}
      CONNECTME_GUACAMOLE_KEY: ${CONNECTME_GUACAMOLE_KEY:?configure CONNECTME_GUACAMOLE_KEY}
      CONNECTME_REMOTE_DENY_CIDRS: ${CONNECTME_REMOTE_DENY_CIDRS:-192.168.1.248/32}
      CONNECTME_SELF_SSH_TARGET: ${CONNECTME_SELF_SSH_TARGET:-}
      CONNECTME_SSH_KNOWN_HOSTS: /etc/connectme/ssh_known_hosts
      CONNECTME_RDP_IGNORE_CERT: ${CONNECTME_RDP_IGNORE_CERT:-false}
      CONNECTME_RDP_INSECURE_CIDRS: ${CONNECTME_RDP_INSECURE_CIDRS:-}
      CONNECTME_TRANSFER_ROOT: /var/lib/connectme/transfers
    depends_on:
      postgres: {condition: service_healthy}
      guacamole: {condition: service_healthy}
    ports: ["0.0.0.0:8080:8080"]
    healthcheck:
      test: ["CMD", "/connectme", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [frontend, backend, remote-control]
    read_only: true
    volumes:
      - transfer-data-v2:/var/lib/connectme/transfers
      - ./config/ssh_known_hosts:/etc/connectme/ssh_known_hosts:ro
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
  guacamole:
    restart: unless-stopped
    image: docker.io/guacamole/guacamole:1.6.0
    environment:
      GUACD_HOSTNAME: guacd
      JSON_ENABLED: "true"
      JSON_SECRET_KEY: ${CONNECTME_GUACAMOLE_KEY:?configure CONNECTME_GUACAMOLE_KEY}
    networks: [remote-control, remote-data]
    depends_on:
      guacd: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "-o", "/dev/null", "http://127.0.0.1:8080/guacamole/"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6
    security_opt: [no-new-privileges:true]
  guacd:
    restart: unless-stopped
    image: docker.io/guacamole/guacd:1.6.0
    healthcheck:
      test: ["CMD", "nc", "-z", "-w", "2", "127.0.0.1", "4822"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    volumes: [transfer-data-v2:/var/lib/connectme/transfers]
    networks: [remote-data, remote-egress]
    security_opt: [no-new-privileges:true]
networks:
  remote-control: {internal: true}
  remote-data: {internal: true}
  remote-egress: {}
  frontend: {}
  backend: {internal: true}
volumes:
  postgres-data:
  # New volume identity avoids reusing the old UID 10001 tmpfs options.
  transfer-data-v2:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=512m,uid=1000,gid=1000,mode=0700,nosuid,nodev,noexec"
